{% extends "base.html" %}

{% block title %}Register - NaijaTechHub{% endblock %}

{% block content %}
<section class="py-5" style="background: linear-gradient(135deg, #2563eb, #7c3aed); min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <h3 class="text-center fw-bold mb-4">Create Account</h3>
                        <form method="POST" action="{{ url_for('register') }}">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="name" class="form-control" required placeholder="John Doe">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required placeholder="your@email.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required placeholder="••••••••">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Skills (comma separated)</label>
                                <input type="text" name="skills" class="form-control" placeholder="Python, HTML, CSS, JavaScript">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Location</label>
                                <input type="text" name="location" class="form-control" placeholder="Lagos, Nigeria">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
                        </form>
                        <p class="text-center mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
